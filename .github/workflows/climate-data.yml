name: Climate data (NASA GISTEMP)

on:
  workflow_dispatch:
  push:
    branches: [claude/virtual-animated-maps-DT130]
    paths:
      - scripts/build_climate_data.py
      - .github/workflows/climate-data.yml
  schedule:
    - cron: "0 6 16 * *"   # monthly, after GISTEMP's mid-month update

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy shapely netCDF4
      - run: python scripts/build_climate_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "climate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add klimat/data/climate-data.json
          git commit -m "data: refresh NASA GISTEMP series ($(date -u +%Y-%m-%d))" || echo "no changes"
          git push
